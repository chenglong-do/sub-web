name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

# 推送到你 Docker Hub 账号下的 subweb 仓库
# 如需推到其他命名空间，改成如 careywong/subweb
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/subweb

jobs:
  # amd64 / arm64 各用对应架构的原生 runner 并行构建，无需 QEMU 模拟，速度接近分钟级
  build-and-push:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          # master 分支推送 latest；tag 推送 semver 版本标签；所有构建带 sha 标签
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    # PR 不登录不推送，仅做构建校验；push/tag 才推送
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    # 同一 tag 由两个 job 分别 push 对应平台，Docker Hub 自动合并为 multi-arch manifest
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.platform }}
        cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ matrix.platform }}
